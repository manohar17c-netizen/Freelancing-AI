name: CI-CD Pipeline

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-checks:
    name: Backend Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn python-multipart requests certifi pypdf python-docx

      - name: Compile backend Python files
        run: python -m py_compile backend/scripts/main.py backend/scripts/database.py backend/scripts/auth.py ui_routes.py

      - name: Start backend server
        run: |
          python -m uvicorn main:app --app-dir backend/scripts --host 127.0.0.1 --port 8000 > /tmp/freelancing_ai_uvicorn.log 2>&1 &
          echo $! > /tmp/freelancing_ai_uvicorn.pid

      - name: Wait for backend healthcheck
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/freelancing_ai_uvicorn.log
          exit 1

      - name: Run backend API smoke test
        run: python backend/scripts/test_api.py

      - name: Print backend log on failure
        if: failure()
        run: cat /tmp/freelancing_ai_uvicorn.log

      - name: Stop backend server
        if: always()
        run: |
          if [ -f /tmp/freelancing_ai_uvicorn.pid ]; then
            kill "$(cat /tmp/freelancing_ai_uvicorn.pid)" || true
          fi

  frontend-checks:
    name: Frontend Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests if present
        working-directory: frontend
        run: npm test --if-present

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  deploy-staging:
    name: Deploy Staging
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    needs:
      - backend-checks
      - frontend-checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to staging
        run: echo "Deploying to staging server..."

  deploy-production:
    name: Deploy Production
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs:
      - backend-checks
      - frontend-checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to production
        run: echo "Deploying to production server..."
